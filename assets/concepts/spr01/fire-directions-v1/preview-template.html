<!doctype html><html lang="ja"><meta charset="utf-8"><title>SPR-01 種・水 4方向</title>
<style>body{margin:24px;background:#272c2d;color:#fff9e7;font:15px system-ui}h1{font-size:22px}button,select,input{font:inherit;margin:5px;padding:5px}main{display:grid;grid-template-columns:repeat(4,minmax(180px,1fr));gap:12px}article{background:#353d3d;padding:12px;text-align:center;border-radius:8px}canvas{width:192px;height:256px;image-rendering:pixelated;max-width:100%}small{display:block;color:#c2c9b7}.label{font-size:13px}@media(max-width:900px){main{grid-template-columns:repeat(2,1fr)}}</style>
<h1>種・水の発射：4方向</h1><p>種は通常の目。水の正面は前回と同じ動きです。各24×36px、足元固定。左右の双葉は個別原稿です。</p>
<button id="play">一時停止</button><label>速度<select id="speed"><option value="1">1倍</option><option value="0.25">1/4倍</option></select></label><button id="restart">先頭から</button><span id="time"></span><input id="scrub" type="range" min="0" max="3999" value="0" style="width:300px"><main id="cards"></main>
<p><small>4秒ループ。種400ms・発射66ms／水800ms・発射400ms。弾の軌道は方向を確認するためのプレビュー用です。形成エフェクトとキャラクターは別レイヤー。</small></p>
<script id="data" type="application/json">__DATA__</script><script>
const data=JSON.parse(document.querySelector('#data').textContent),cards=[];
for(const action of ['seed','water'])for(const direction of data.directions){const article=document.createElement('article');article.innerHTML=`<b>${action==='seed'?'種':'水'} / ${direction}</b><br><canvas width="48" height="64"></canvas><div class="label"></div>`;document.querySelector('#cards').append(article);cards.push({action,direction,canvas:article.querySelector('canvas'),label:article.querySelector('.label')});}
let playing=true,t=0,last=performance.now();
function grid(ctx,g,pal,ox=12,oy=12){for(let y=0;y<g.length;y++)for(let x=0;x<g[y].length;x++){let c=g[y][x];if(c==='.')continue;let p=pal[c];ctx.fillStyle=`rgb(${p[0]},${p[1]},${p[2]})`;ctx.fillRect(x+ox,y+oy,1,1)}}
function paint(){for(const card of cards){const a=data.actions[card.action],f=a.frames_by_direction[card.direction].find(f=>f.start_ms<=t&&t<f.end_ms),ctx=card.canvas.getContext('2d');ctx.imageSmoothingEnabled=false;ctx.fillStyle='#272c2d';ctx.fillRect(0,0,48,64);grid(ctx,f?f.character_grid:data.idle[card.direction],data.palettes.character);if(f)grid(ctx,f.formation_grid,data.palettes.fx);if(t>=a.release_ms&&t<a.release_ms+120){const [sx,sy]=a.socket_by_direction[card.direction],[vx,vy]={down:[0,1],left:[-1,0],right:[1,0],up:[0,-1]}[card.direction],travel=Math.floor((t-a.release_ms)*.24);grid(ctx,a.projectile_grid,data.palettes.fx,12+sx-4+vx*travel,12+sy-4+vy*travel)}card.label.textContent=f?`F${f.index} / ${f.start_ms}–${f.end_ms}ms`:'待機';}document.querySelector('#time').textContent=` ${Math.floor(t)}ms`;document.querySelector('#scrub').value=t;}
document.querySelector('#play').onclick=()=>{playing=!playing;document.querySelector('#play').textContent=playing?'一時停止':'再生'};document.querySelector('#restart').onclick=()=>{t=0;paint()};document.querySelector('#scrub').oninput=e=>{t=Number(e.target.value);playing=false;document.querySelector('#play').textContent='再生';paint()};function loop(now){if(playing)t=(t+(now-last)*Number(document.querySelector('#speed').value))%4000;last=now;paint();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></html>
